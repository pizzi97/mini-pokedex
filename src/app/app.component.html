<!--
  Root shell layout providing global application chrome.

  Renders the primary top navigation bar with brand identification,
  active route link tracking with exact path matching, and hosts
  the routed view container outlet.
-->

<nav class="global-nav">
  <div class="nav-content">
    <a routerLink="/" class="logo">Mini Pokédex</a>
    <div class="nav-links">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Pokédex</a>
      <a routerLink="/team" routerLinkActive="active">My Team</a>
    </div>
  </div>
</nav>

<main class="main-content">
  <router-outlet></router-outlet>
</main>
