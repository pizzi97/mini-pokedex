<div class="page-container">
  <header class="header">
    <h1>National Pokédex</h1>

    <div class="controls-bar">
      <!-- Ricerca testuale con debounce -->
      <input
        type="text"
        placeholder="Cerca per nome..."
        (input)="onSearchChange($event)"
        class="search-input"
      />

      <!-- Filtro per tipo -->
      <select (change)="onTypeChange($event)" class="type-select">
        <option value="">Tutti i Tipi</option>
        @for (type of types; track type) {
          <option [value]="type">{{ type | titlecase }}</option>
        }
      </select>
    </div>
  </header>

  @if (store.error()) {
    <div class="error-message">
      {{ store.error() }}
    </div>
  }

  <div class="pokemon-grid">
    @for (pokemon of selectors.filteredPokemon$ | async; track pokemon.id) {
      <app-pokemon-card
        [pokemon]="pokemon"
        (cardClick)="goToDetail($event)">
      </app-pokemon-card>
    }
  </div>

  @if (store.isLoading()) {
    <div class="loading-grid">
      @for (i of [1,2,3,4,5,6,7,8]; track i) {
        <div class="sk-shimmer skeleton-card"></div>
      }
    </div>
  }

  <!-- Paginazione -->
  <div class="pagination-bar">
    <button
      class="nav-btn"
      [disabled]="currentPage === 1 || store.isLoading()"
      (click)="prevPage()">
      &larr; Precedente
    </button>
    <span class="page-indicator">Pagina {{ currentPage }}</span>
    <button
      class="nav-btn"
      [disabled]="store.isLoading()"
      (click)="nextPage()">
      Successivo &rarr;
    </button>
  </div>
</div>
