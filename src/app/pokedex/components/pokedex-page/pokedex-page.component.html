<div class="page-container">
  <header class="header">
    <h1>Pokédex</h1>

    <div class="controls-bar">
      <input
        type="text"
        placeholder="Search Pokémon by name..."
        (input)="onSearchChange($event)"
        class="search-input"
      />

      <select (change)="onTypeChange($event)" class="type-select">
        <option value="">All Types</option>
        @for (type of types; track type) {
          <option [value]="type">{{ type | titlecase }}</option>
        }
      </select>
    </div>
  </header>

  @if (store.error()) {
    <div class="error-message">
      {{ store.error() }}
    </div>
  }

  <div class="pokemon-grid">
    @for (pokemon of (selectors.filteredPokemon$ | async) ?? []; track pokemon.id) {
      <app-pokemon-card
        [pokemon]="pokemon"
        (cardClick)="goToDetail($event)">
      </app-pokemon-card>
    }
  </div>

  @if (store.isLoading()) {
    <div class="loading-grid">
      @for (skeletonId of skeletons; track skeletonId) {
        <div class="sk-shimmer skeleton-card"></div>
      }
    </div>
  }

  <div class="pagination-bar">
    <button
      class="nav-btn"
      [disabled]="currentPage === 1 || store.isLoading()"
      (click)="prevPage()">
      &larr; Previous
    </button>
    <span class="page-indicator">Page {{ currentPage }}</span>
    <button
      class="nav-btn"
      [disabled]="store.isLoading()"
      (click)="nextPage()">
      Next &rarr;
    </button>
  </div>
</div>
