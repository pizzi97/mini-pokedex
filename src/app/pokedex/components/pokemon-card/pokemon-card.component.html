<div class="card-container">
  <div class="sprite-wrapper">
    <img [src]="pokemon().spriteUrl" [alt]="pokemon().name" loading="lazy" />
  </div>
  <div class="details">
    <span class="id-badge">#{{ pokemon().id | number:'3.0-0' }}</span>
    <h3 class="name">{{ pokemon().name | titlecase }}</h3>

    <div class="types">
      @for (type of pokemon().types; track type) {
        <span class="type-badge">{{ type | titlecase }}</span>
      }
    </div>
  </div>
</div>
